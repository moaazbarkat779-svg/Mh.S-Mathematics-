<!DOCTYPE html>
<html>

<head>
    <title>Teacher Log in. | Mh.S Mathematics</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>

        <h2>Mh.S Mathematics</h2>

        <div>
            <a href="index.html">Home</a>
        </div>

    </nav>


    <section id="apply-page">

        <p class="section-label">
            Account Log in
        </p>

        <h1>
            Teacher Log in
        </h1>

        <p>
            Sign in to access the application dashboard.
        </p>


        <form id="login-form">

            <label for="login-email">
                Email
            </label>

            <input
                type="email"
                id="login-email"
                placeholder="Email"
                required
            >

            <label for="login-password">
                Password
            </label>

            <input
                type="password"
                id="login-password"
                placeholder="Password"
                required
            >


            <button type="submit">
                Sign In
            </button>

        </form>

    </section>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="script.js"></script>

</body>

</html>
