<!DOCTYPE html>
<html>

<head>
    <title>Set Password | Mh.S Mathematics</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h2>Mh.S</h2>

    <div>
        <a href="index.html">Home</a>
    </div>
</nav>

<section id="application-page">

    <p class="section-label">STUDENT ACCOUNT</p>

    <h1>Set Your Password</h1>

    <p>
        Welcome to Mh.S Mathematics.
        Please choose a password for your student account.
    </p>

    <div class="form-group">
        <label for="new-password">
            New Password
        </label>

        <input
            type="password"
            id="new-password"
            placeholder="Enter your password"
        >
    </div>

    <div class="form-group">
        <label for="confirm-password">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirm-password"
            placeholder="Confirm your password"
        >
    </div>

    <button id="set-password-button">
        Set Password
    </button>

    <p id="password-message"></p>

</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>

</html>
